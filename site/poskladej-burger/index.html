<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Poskládej burger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --counter:#2FA58C;
    --counter-deep:#217A67;
    --tile:#FFF6E6;
    --tile-edge:#E7D2AE;
    --plate:#FFFDF7;
    --ink:#3A2440;
    --ink-soft:#7A6270;
    --tomato:#EE4B3C;
    --mustard:#FFC93C;
    --mint:#8DE0C9;
    --shadow:rgba(33,122,103,.35);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --counter:#1E7C68;
      --counter-deep:#14564A;
      --tile:#FFF3E0;
      --ink:#33203A;
      --shadow:rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --counter:#1E7C68; --counter-deep:#14564A; --tile:#FFF3E0; --ink:#33203A; --shadow:rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
    font-weight:700;
    color:var(--ink);
    background:var(--counter);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,.14) 0 22%, transparent 23%),
      radial-gradient(circle at 88% 78%, rgba(255,255,255,.10) 0 18%, transparent 19%);
    overflow:hidden;
    user-select:none;
    touch-action:manipulation;
  }
  #app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .screen{display:none;flex:1;min-height:0;flex-direction:column}
  .screen.show{display:flex}

  /* ---------- start ---------- */
  #screen-start{justify-content:center;align-items:center;gap:18px;padding:20px;text-align:center;overflow-y:auto}
  .logo{font-size:clamp(34px,10vw,56px);font-weight:800;line-height:.95;color:var(--tile);
        text-shadow:0 5px 0 var(--counter-deep),0 9px 18px var(--shadow);letter-spacing:-.5px}
  .logo small{display:block;font-size:.38em;font-weight:700;color:var(--mint);text-shadow:none;margin-top:8px}
  .levels{display:flex;flex-direction:column;gap:12px;width:min(340px,92vw)}
  .lvl{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;border-radius:22px;
       background:var(--tile);box-shadow:0 6px 0 var(--tile-edge),0 12px 22px var(--shadow);
       font-family:inherit;font-size:20px;font-weight:800;color:var(--ink);text-align:left;cursor:pointer}
  .lvl:active{transform:translateY(4px);box-shadow:0 2px 0 var(--tile-edge)}
  .lvl svg{flex:none}
  .lvl span{display:block;font-size:14px;font-weight:600;color:var(--ink-soft);line-height:1.25}
  .lvl:focus-visible{outline:4px solid var(--mustard);outline-offset:3px}
  .best{color:var(--tile);opacity:.9;font-size:16px}

  /* ---------- hud ---------- */
  .hud{display:flex;align-items:center;gap:10px;padding:10px 12px 6px}
  .icon-btn{width:42px;height:42px;flex:none;border:0;border-radius:14px;background:rgba(255,255,255,.18);
            color:var(--tile);font-size:20px;font-family:inherit;cursor:pointer;display:grid;place-items:center}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
  .lives{display:flex;gap:4px;font-size:24px;line-height:1}
  .heart.gone{opacity:.25;filter:grayscale(1)}
  .hud-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .score-box{background:rgba(255,255,255,.18);color:var(--tile);border-radius:14px;padding:6px 14px;font-size:20px;font-weight:800;min-width:74px;text-align:center}
  .round-tag{color:var(--tile);opacity:.85;font-size:15px}

  .timer{height:16px;margin:2px 14px 10px;border-radius:99px;background:rgba(0,0,0,.18);overflow:hidden}
  .timer-fill{height:100%;width:100%;border-radius:99px;background:var(--mint);transform-origin:left center}
  .timer-fill.warn{background:var(--mustard)}
  .timer-fill.danger{background:var(--tomato)}

  /* ---------- board ---------- */
  .board{flex:1;min-height:120px;display:flex;gap:10px;padding:0 12px;overflow:hidden}
  .panel{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
  .panel h2{margin:0;font-size:14px;font-weight:700;color:var(--tile);opacity:.9}
  .plate{flex:1;min-height:0;width:100%;border-radius:20px;background:var(--plate);
         box-shadow:inset 0 -8px 0 rgba(0,0,0,.06),0 8px 18px var(--shadow);
         display:flex;align-items:flex-end;justify-content:center;padding:10px 8px 12px;position:relative;overflow:hidden}
  .plate svg{max-height:100%;max-width:100%;height:auto}
  .plate.empty::after{content:'?';position:absolute;inset:0;display:grid;place-items:center;
                      font-size:44px;color:var(--tile-edge)}
  .plate.shake{animation:shake .32s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}

  /* ---------- palette ---------- */
  .palette{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:8px;padding:10px 12px 12px;
           flex:none;max-width:100%;max-height:40dvh;overflow-y:auto;overflow-x:hidden}
  .chip{border:0;border-radius:18px;background:var(--tile);box-shadow:0 5px 0 var(--tile-edge);
        padding:6px 5px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;
        font-family:inherit;font-size:11px;font-weight:700;color:var(--ink-soft);min-width:0;overflow:hidden}
  .chip:active{transform:translateY(3px);box-shadow:0 2px 0 var(--tile-edge)}
  .chip:focus-visible{outline:4px solid var(--mustard);outline-offset:2px}
  .chip svg{width:100%;height:auto;display:block}
  .chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .chip.used{opacity:.35;pointer-events:none}
  .chip.bad{animation:shake .32s;background:#FFD9D4}

  /* ---------- overlays ---------- */
  .veil{position:fixed;inset:0;display:none;place-items:center;background:rgba(20,60,52,.82);
        backdrop-filter:blur(3px);padding:24px;text-align:center;z-index:9}
  .veil.show{display:grid}
  .card{background:var(--tile);border-radius:28px;padding:22px;box-shadow:0 12px 30px rgba(0,0,0,.35);
        width:min(340px,90vw);display:flex;flex-direction:column;align-items:center;gap:10px}
  .card h3{margin:0;font-size:28px;font-weight:800}
  .card p{margin:0;font-size:17px;font-weight:600;color:var(--ink-soft)}
  .big-btn{border:0;border-radius:20px;background:var(--tomato);color:#fff;font-family:inherit;
           font-size:21px;font-weight:800;padding:13px 28px;cursor:pointer;box-shadow:0 6px 0 #B9291D}
  .big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #B9291D}
  .big-btn.ghost{background:var(--counter);box-shadow:0 6px 0 var(--counter-deep)}
  .big-btn.ghost:active{box-shadow:0 2px 0 var(--counter-deep)}
  .big-btn:focus-visible{outline:4px solid var(--mustard);outline-offset:3px}
  .memo{font-size:22px;font-weight:800;color:var(--tile)}
  .memo-dots{display:flex;gap:8px;margin-top:6px;justify-content:center}
  .memo-dots i{width:12px;height:12px;border-radius:50%;background:var(--tile);opacity:.35}
  .memo-dots i.on{opacity:1}
  #flashPlate{background:var(--plate);border-radius:24px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
  #flashPlate svg{height:min(46dvh,340px);width:auto}

  .pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:30px;font-weight:800;
       color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);pointer-events:none;opacity:0;z-index:20}
  .pop.go{animation:pop .9s ease-out}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-40%) scale(.7)}25%{opacity:1;transform:translate(-50%,-55%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="app">

  <section id="screen-start" class="screen show">
    <div class="logo">Poskládej<br>burger<small>Zapamatuj si předlohu a skládej odspodu</small></div>
    <div class="levels" id="levels"></div>
    <div class="best" id="bestStart"></div>
  </section>

  <section id="screen-game" class="screen">
    <div class="hud">
      <button class="icon-btn" id="btnHome" aria-label="Zpět na výběr úrovně">🏠</button>
      <div class="lives" id="lives"></div>
      <div class="hud-right">
        <div class="round-tag" id="roundTag">Kolo 1</div>
        <div class="score-box" id="score">0</div>
        <button class="icon-btn" id="btnSound" aria-label="Zvuk">🔊</button>
      </div>
    </div>
    <div class="timer"><div class="timer-fill" id="timerFill"></div></div>
    <div class="board">
      <div class="panel">
        <h2>Předloha</h2>
        <div class="plate" id="recipePlate"></div>
      </div>
      <div class="panel">
        <h2>Ty skládáš</h2>
        <div class="plate" id="buildPlate"></div>
      </div>
    </div>
    <div class="palette" id="palette"></div>
  </section>

</div>

<div class="veil" id="veilMemo">
  <div>
    <div class="memo">Zapamatuj si!</div>
    <div class="memo-dots" id="memoDots"></div>
    <div id="flashPlate" style="margin-top:14px"></div>
  </div>
</div>

<div class="veil" id="veilRound">
  <div class="card">
    <div id="roundEmoji" style="font-size:52px">🎉</div>
    <h3 id="roundTitle">Hotovo!</h3>
    <p id="roundText"></p>
  </div>
</div>

<div class="veil" id="veilOver">
  <div class="card">
    <div style="font-size:52px">🍔</div>
    <h3>Konec hry</h3>
    <p id="overText"></p>
    <button class="big-btn" id="btnAgain">Hrát znovu</button>
    <button class="big-btn ghost" id="btnMenu">Změnit úroveň</button>
  </div>
</div>

<div class="pop" id="pop"></div>

<script>
/* ============ ingredients ============ */
const W = 140;
const ING = {
  bunBottom:{label:'Houska',h:28,draw:y=>`
    <path d="M14 ${y} h112 v10 a15 15 0 0 1 -15 18 h-82 a15 15 0 0 1 -15 -18 z" fill="#DFA25C"/>
    <rect x="14" y="${y}" width="112" height="7" rx="3" fill="#F0BE81"/>`},
  bunTop:{label:'Vršek',h:42,draw:y=>`
    <path d="M10 ${y+42} v-9 a60 33 0 0 1 120 0 v9 z" fill="#E9B26C"/>
    <ellipse cx="46" cy="${y+16}" rx="7" ry="4" fill="#FBEBD2"/>
    <ellipse cx="74" cy="${y+10}" rx="7" ry="4" fill="#FBEBD2"/>
    <ellipse cx="100" cy="${y+18}" rx="7" ry="4" fill="#FBEBD2"/>
    <ellipse cx="60" cy="${y+27}" rx="7" ry="4" fill="#FBEBD2"/>
    <ellipse cx="90" cy="${y+30}" rx="7" ry="4" fill="#FBEBD2"/>`},
  patty:{label:'Maso',h:26,draw:y=>`
    <rect x="6" y="${y}" width="128" height="26" rx="12" fill="#77482A"/>
    <circle cx="40" cy="${y+10}" r="4" fill="#5C3620"/>
    <circle cx="86" cy="${y+16}" r="4" fill="#5C3620"/>
    <circle cx="108" cy="${y+8}" r="3" fill="#5C3620"/>`},
  cheese:{label:'Sýr',h:22,draw:y=>`
    <path d="M12 ${y} h116 v10 l-15 10 -17 -8 -18 10 -17 -10 -16 8 -16 -10 z" fill="#FFC93C"/>
    <rect x="12" y="${y}" width="116" height="5" fill="#FFDD80"/>`},
  lettuce:{label:'Salát',h:22,draw:y=>`
    <path d="M6 ${y+8} q10 -12 22 -2 q11 -13 24 -1 q12 -12 24 -1 q12 -12 24 0 q12 -10 24 2 v13 h-118 z" fill="#63C247"/>
    <path d="M6 ${y+16} q30 6 62 1 q30 -5 66 2 v3 h-128 z" fill="#4CA636"/>`},
  tomato:{label:'Rajče',h:20,draw:y=>`
    <rect x="10" y="${y}" width="120" height="20" rx="10" fill="#EE4B3C"/>
    <rect x="26" y="${y+5}" width="88" height="10" rx="5" fill="#FF8577"/>`},
  onion:{label:'Cibule',h:16,draw:y=>`
    <path d="M18 ${y+13} a22 11 0 0 1 44 0" fill="none" stroke="#C48CE0" stroke-width="6" stroke-linecap="round"/>
    <path d="M56 ${y+13} a22 11 0 0 1 44 0" fill="none" stroke="#C48CE0" stroke-width="6" stroke-linecap="round"/>
    <path d="M92 ${y+13} a20 11 0 0 1 38 0" fill="none" stroke="#C48CE0" stroke-width="6" stroke-linecap="round"/>`},
  pickle:{label:'Okurka',h:16,draw:y=>`
    <ellipse cx="38" cy="${y+8}" rx="22" ry="7" fill="#3E8E41"/>
    <ellipse cx="70" cy="${y+8}" rx="22" ry="7" fill="#4C9F4A"/>
    <ellipse cx="102" cy="${y+8}" rx="22" ry="7" fill="#3E8E41"/>
    <ellipse cx="38" cy="${y+8}" rx="11" ry="3" fill="#7DBE63"/>
    <ellipse cx="102" cy="${y+8}" rx="11" ry="3" fill="#7DBE63"/>`},
  bacon:{label:'Slanina',h:16,draw:y=>`
    <path d="M8 ${y+8} q18 -9 35 0 t35 0 t35 0 t22 0" fill="none" stroke="#D9604F" stroke-width="12" stroke-linecap="round"/>
    <path d="M8 ${y+5} q18 -9 35 0 t35 0 t35 0 t22 0" fill="none" stroke="#F3C0B4" stroke-width="4" stroke-linecap="round"/>`},
  egg:{label:'Vejce',h:24,draw:y=>`
    <ellipse cx="70" cy="${y+13} " rx="62" ry="11" fill="#FFF8EC"/>
    <circle cx="70" cy="${y+12}" r="9" fill="#FFC93C"/>`},
  ketchup:{label:'Kečup',h:12,draw:y=>`
    <path d="M14 ${y+7} q16 -7 32 0 t32 0 t32 0 t18 0" fill="none" stroke="#E0392B" stroke-width="9" stroke-linecap="round"/>`},
  mustard:{label:'Hořčice',h:12,draw:y=>`
    <path d="M14 ${y+7} q16 -7 32 0 t32 0 t32 0 t18 0" fill="none" stroke="#F0AF16" stroke-width="9" stroke-linecap="round"/>`}
};
const MIDDLE = ['patty','cheese','lettuce','tomato','onion','pickle','bacon','egg','ketchup','mustard'];
const LOOKALIKE = {tomato:'ketchup',ketchup:'tomato',lettuce:'pickle',pickle:'lettuce',cheese:'mustard',mustard:'cheese',patty:'bacon',bacon:'patty',egg:'cheese',onion:'bacon'};

function stackHeight(ids){return ids.reduce((s,i)=>s+ING[i].h,0)+10}
function stackSVG(ids,canvasH){
  const H = canvasH || stackHeight(ids);
  let y = H-5, parts=[];
  for(const id of ids){ y -= ING[id].h; parts.push(ING[id].draw(y)); }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${parts.join('')}</svg>`;
}
function chipSVG(id){
  const box = 58, y = Math.round((box-ING[id].h)/2);
  return `<svg viewBox="0 0 ${W} ${box}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${ING[id].draw(y)}</svg>`;
}

/* ============ levels ============ */
const LEVELS = {
  lehka:{name:'Lehká',hint:'Předloha je vidět celou dobu',mid:[1,2],time:[40,2,20],preview:'static',extras:2,icon:'🙂'},
  stredni:{name:'Střední',hint:'Předloha pomalu bledne',mid:[3,4],time:[32,2.5,15],preview:'fade',extras:2,icon:'😃'},
  tezka:{name:'Těžká',hint:'Předloha se ukáže jen na chvilku',mid:[5,6],time:[27,2,12],preview:'flash',extras:3,icon:'🤩'}
};

/* ============ state ============ */
let S = null, rafId = null, audio = null, soundOn = true;

const $ = s => document.querySelector(s);
const el = {
  start:$('#screen-start'), game:$('#screen-game'), levels:$('#levels'), bestStart:$('#bestStart'),
  lives:$('#lives'), score:$('#score'), roundTag:$('#roundTag'), timerFill:$('#timerFill'),
  recipe:$('#recipePlate'), build:$('#buildPlate'), palette:$('#palette'),
  veilMemo:$('#veilMemo'), memoDots:$('#memoDots'), flashPlate:$('#flashPlate'),
  veilRound:$('#veilRound'), roundEmoji:$('#roundEmoji'), roundTitle:$('#roundTitle'), roundText:$('#roundText'),
  veilOver:$('#veilOver'), overText:$('#overText'), pop:$('#pop')
};

/* ============ sound ============ */
function tone(freq,dur,type='sine',vol=.1,delay=0){
  if(!soundOn) return;
  try{
    audio = audio || new (window.AudioContext||window.webkitAudioContext)();
    const t = audio.currentTime + delay;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
const sfxGood = ()=>{tone(660,.12,'triangle',.11);tone(880,.16,'triangle',.11,.09)};
const sfxBad  = ()=>{tone(200,.22,'sine',.12);tone(150,.24,'sine',.1,.08)};
const sfxWin  = ()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.11,i*.09))};
const sfxOver = ()=>{[523,440,349,262].forEach((f,i)=>tone(f,.28,'sine',.1,i*.14))};
const sfxTick = ()=>tone(440,.06,'square',.05);

/* ============ storage ============ */
function bestFor(lvl){ try{ return +(localStorage.getItem('burger_best_'+lvl)||0) }catch(e){ return 0 } }
function saveBest(lvl,v){ try{ if(v>bestFor(lvl)) localStorage.setItem('burger_best_'+lvl,v) }catch(e){} }

/* ============ start screen ============ */
function buildStart(){
  el.levels.innerHTML='';
  Object.entries(LEVELS).forEach(([key,L])=>{
    const b=document.createElement('button');
    b.className='lvl'; b.type='button';
    b.innerHTML=`<div style="font-size:30px">${L.icon}</div><div>${L.name}<span>${L.hint}</span></div>`;
    b.onclick=()=>startGame(key);
    el.levels.appendChild(b);
  });
  const bests=Object.entries(LEVELS).map(([k,L])=>bestFor(k)?`${L.name} ${bestFor(k)}`:null).filter(Boolean);
  el.bestStart.textContent = bests.length? 'Nejlepší skóre: '+bests.join(' · ') : '';
}

/* ============ game flow ============ */
function startGame(levelKey){
  S={level:levelKey,cfg:LEVELS[levelKey],round:0,lives:3,score:0,recipe:[],built:[],canvasH:0,
     timeLimit:0,timeLeft:0,running:false,last:0,fadeMs:0};
  el.start.classList.remove('show'); el.game.classList.add('show');
  closeVeils(); nextRound();
}
function closeVeils(){ [el.veilMemo,el.veilRound,el.veilOver].forEach(v=>v.classList.remove('show')); }

function makeRecipe(){
  const c=S.cfg, span=c.mid[1]-c.mid[0];
  const n=Math.min(c.mid[1], c.mid[0]+Math.floor(S.round/3)) + (span&&S.round>5?0:0);
  const pool=[...MIDDLE].sort(()=>Math.random()-.5);
  const mid=pool.slice(0,Math.max(c.mid[0],n));
  return ['bunBottom',...mid,'bunTop'];
}
function makePalette(recipe){
  const need=recipe.slice();
  const used=new Set(need);
  const extras=[];
  if(S.cfg.preview==='flash'){
    for(const id of recipe){ const l=LOOKALIKE[id]; if(l&&!used.has(l)&&extras.length<S.cfg.extras){extras.push(l);used.add(l)} }
  }
  const rest=MIDDLE.filter(i=>!used.has(i)).sort(()=>Math.random()-.5);
  while(extras.length<S.cfg.extras && rest.length) extras.push(rest.pop());
  return [...need,...extras].sort(()=>Math.random()-.5);
}

function nextRound(){
  S.round++;
  S.recipe=makeRecipe();
  S.built=[];
  S.canvasH=stackHeight(S.recipe);
  const [base,step,min]=S.cfg.time;
  S.timeLimit=Math.max(min, base-(S.round-1)*step)*1000;
  S.timeLeft=S.timeLimit;
  S.fadeMs=Math.max(4000,S.timeLimit*.55);

  el.roundTag.textContent='Kolo '+S.round;
  renderLives(); renderScore(); renderBuild(); renderPalette(makePalette(S.recipe));
  el.recipe.classList.remove('empty'); el.recipe.style.opacity=1;
  el.recipe.innerHTML=stackSVG(S.recipe,S.canvasH);
  el.timerFill.style.transform='scaleX(1)';
  el.timerFill.className='timer-fill';

  if(S.cfg.preview==='flash') showMemo(); else beginPlay();
}

function showMemo(){
  const secs=Math.max(1.4, 3.4-(S.round-1)*.2);
  el.flashPlate.innerHTML=stackSVG(S.recipe,S.canvasH);
  el.memoDots.innerHTML='<i class="on"></i><i class="on"></i><i class="on"></i>';
  el.veilMemo.classList.add('show');
  el.recipe.classList.add('empty'); el.recipe.innerHTML='';
  const dots=[...el.memoDots.children];
  let k=dots.length;
  const step=secs*1000/dots.length;
  sfxTick();
  const iv=setInterval(()=>{ k--; if(dots[k])dots[k].classList.remove('on'); sfxTick(); },step);
  setTimeout(()=>{ clearInterval(iv); el.veilMemo.classList.remove('show'); beginPlay(); }, secs*1000);
}

function beginPlay(){
  S.running=true; S.last=performance.now();
  cancelAnimationFrame(rafId); rafId=requestAnimationFrame(tick);
}
function tick(now){
  if(!S||!S.running) return;
  const dt=now-S.last; S.last=now; S.timeLeft-=dt;
  const r=Math.max(0,S.timeLeft/S.timeLimit);
  el.timerFill.style.transform='scaleX('+r+')';
  el.timerFill.className='timer-fill'+(r<.18?' danger':r<.42?' warn':'');
  if(S.cfg.preview==='fade'){
    const gone=S.timeLimit-S.timeLeft;
    el.recipe.style.opacity=Math.max(0,1-gone/S.fadeMs);
  }
  if(S.timeLeft<=0){ S.running=false; failRound('time'); return; }
  rafId=requestAnimationFrame(tick);
}

function renderLives(){
  el.lives.innerHTML=[0,1,2].map(i=>`<span class="heart${i<S.lives?'':' gone'}">❤️</span>`).join('');
}
function renderScore(){ el.score.textContent=S.score }
function renderBuild(){
  el.build.innerHTML = S.built.length? stackSVG(S.built,S.canvasH) : '';
}
function renderPalette(ids){
  el.palette.innerHTML='';
  ids.forEach(id=>{
    const b=document.createElement('button');
    b.className='chip'; b.type='button'; b.dataset.id=id;
    b.innerHTML=chipSVG(id)+`<span>${ING[id].label}</span>`;
    b.onclick=()=>pick(id,b);
    el.palette.appendChild(b);
  });
}
function popText(t,color){
  el.pop.textContent=t; el.pop.style.color=color||'#fff';
  el.pop.classList.remove('go'); void el.pop.offsetWidth; el.pop.classList.add('go');
}

function pick(id,btn){
  if(!S||!S.running) return;
  const want=S.recipe[S.built.length];
  if(id===want){
    S.built.push(id);
    S.score+=10; renderScore(); renderBuild(); sfxGood();
    btn.classList.add('used');
    if(S.built.length===S.recipe.length) winRound();
  }else{
    S.lives--; S.score=Math.max(0,S.score-15);
    renderLives(); renderScore(); sfxBad();
    btn.classList.add('bad'); setTimeout(()=>btn.classList.remove('bad'),340);
    el.build.classList.add('shake'); setTimeout(()=>el.build.classList.remove('shake'),340);
    popText('−1 ❤️','#FFD1CB');
    if(S.lives<=0){ S.running=false; gameOver(); }
  }
}

function winRound(){
  S.running=false; cancelAnimationFrame(rafId);
  const bonus=Math.round(S.timeLeft/1000)*5;
  S.score+=50+bonus; renderScore(); sfxWin();
  el.recipe.style.opacity=1; el.recipe.classList.remove('empty');
  el.recipe.innerHTML=stackSVG(S.recipe,S.canvasH);
  el.roundEmoji.textContent='🎉';
  el.roundTitle.textContent='Hotovo!';
  el.roundText.textContent='+'+(50+bonus)+' bodů';
  el.veilRound.classList.add('show');
  setTimeout(()=>{ el.veilRound.classList.remove('show'); nextRound(); },1700);
}
function failRound(reason){
  cancelAnimationFrame(rafId);
  S.lives--; renderLives(); sfxBad();
  if(S.lives<=0){ gameOver(); return; }
  el.roundEmoji.textContent='⏰';
  el.roundTitle.textContent='Čas vypršel';
  el.roundText.textContent='Zkusíme další burger';
  el.veilRound.classList.add('show');
  setTimeout(()=>{ el.veilRound.classList.remove('show'); nextRound(); },1700);
}
function gameOver(){
  cancelAnimationFrame(rafId);
  sfxOver(); saveBest(S.level,S.score);
  el.overText.textContent='Skóre '+S.score+' · kol '+S.round+' · nejlepší '+bestFor(S.level);
  el.veilOver.classList.add('show');
}

/* ============ controls ============ */
$('#btnHome').onclick=()=>{ cancelAnimationFrame(rafId); if(S)S.running=false; closeVeils(); el.game.classList.remove('show'); el.start.classList.add('show'); buildStart(); };
$('#btnAgain').onclick=()=>{ const lvl=S.level; closeVeils(); startGame(lvl); };
$('#btnMenu').onclick=()=>{ closeVeils(); el.game.classList.remove('show'); el.start.classList.add('show'); buildStart(); };
$('#btnSound').onclick=e=>{ soundOn=!soundOn; e.currentTarget.textContent=soundOn?'🔊':'🔇'; if(soundOn)sfxGood(); };

document.addEventListener('gesturestart',e=>e.preventDefault());
buildStart();
</script>
</body>
</html>
