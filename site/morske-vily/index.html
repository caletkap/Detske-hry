<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mořské víly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#08163a;
  --deep:#123a6d;
  --water:#1c74a8;
  --shallow:#37b3c4;
  --glow:#8ff0e2;
  --pearl:#ffe9a8;
  --gold:#ffc857;
  --coral:#ff7fb0;
  --magic:#a05de0;
  --dark:#4b1d78;
  --ink:#06122e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--abyss)}
body{
  font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  color:#fff;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
#stage{
  position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% -10%, #4fd4d0 0%, #2e9fc0 22%, var(--water) 46%, var(--deep) 72%, var(--abyss) 100%);
}
#stage.shake{animation:shake .38s}
@keyframes shake{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-9px,4px)}
  45%{transform:translate(8px,-5px)}
  70%{transform:translate(-5px,3px)}
}

/* ---------- pozadí ---------- */
.rays{position:absolute;inset:-10% -20% auto -20%;height:70%;pointer-events:none;opacity:.28;
  background:repeating-linear-gradient(97deg, rgba(255,255,255,.55) 0 22px, rgba(255,255,255,0) 22px 96px);
  filter:blur(6px);animation:sway 14s ease-in-out infinite alternate}
@keyframes sway{from{transform:skewX(-4deg) translateX(-16px)}to{transform:skewX(4deg) translateX(16px)}}
.amb{position:absolute;bottom:-60px;border-radius:50%;background:rgba(255,255,255,.35);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);pointer-events:none;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) translateX(24px);opacity:0}}
.weed{position:absolute;bottom:0;transform-origin:bottom center;animation:weed 5s ease-in-out infinite alternate;pointer-events:none}
@keyframes weed{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.swimby{position:absolute;pointer-events:none;opacity:.55;animation:swimby linear infinite}
@keyframes swimby{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

/* ---------- město ---------- */
#city{position:absolute;left:0;right:0;bottom:0;pointer-events:none}
#city svg{display:block;width:100%;height:auto}
#dome{transition:opacity .2s}
#city.hurt{animation:hurt .5s}
@keyframes hurt{0%,100%{filter:none}30%{filter:drop-shadow(0 0 26px #ff5d7a) saturate(1.6)}}

/* ---------- bytosti ---------- */
#layer,#fx{position:absolute;inset:0}
#fx{pointer-events:none}
.ent{position:absolute;left:0;top:0;display:grid;place-items:center;cursor:pointer;will-change:transform}
.ent svg{display:block;pointer-events:none}
.ent .body{animation:bob 2.4s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-3px) rotate(-4deg)}to{transform:translateY(3px) rotate(4deg)}}
.ent.gone{pointer-events:none;animation:gone .3s forwards}
@keyframes gone{to{transform-origin:center;opacity:0}}

/* ---------- efekty ---------- */
.pop{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;pointer-events:none}
.pop i{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;
  background:var(--glow);animation:spark .55s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.ring{position:absolute;left:50%;top:60%;width:40px;height:40px;margin:-20px;border-radius:50%;
  border:6px solid var(--glow);pointer-events:none;animation:ring .8s ease-out forwards}
@keyframes ring{to{transform:scale(26);opacity:0;border-width:1px}}
.float{position:absolute;font-size:26px;font-weight:700;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.25);
  animation:float 1s ease-out forwards}
@keyframes float{to{transform:translateY(-52px);opacity:0}}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;padding:14px 14px 0;display:flex;align-items:flex-start;gap:12px;
  pointer-events:none;padding-top:max(14px,env(safe-area-inset-top))}
#hearts{display:flex;gap:6px}
#hearts span{width:40px;height:40px;display:block;transition:transform .2s,opacity .2s}
#hearts span.off{opacity:.22;transform:scale(.7)}
#bar{flex:1;height:26px;margin-top:7px;border-radius:14px;background:rgba(4,20,48,.45);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.35), 0 0 0 3px rgba(255,255,255,.22);overflow:hidden}
#fill{height:100%;width:0;border-radius:14px;transition:width .25s cubic-bezier(.3,1.4,.5,1);
  background:linear-gradient(90deg,#fff3c4,var(--pearl),#ffd166)}
#sound{pointer-events:auto;width:46px;height:46px;flex:none;border:0;border-radius:50%;font-size:20px;
  background:rgba(4,20,48,.45);color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22)}
#waveTag{position:absolute;top:64px;left:0;right:0;text-align:center;font-size:15px;letter-spacing:.5px;
  opacity:.7;pointer-events:none;padding-top:max(0px,env(safe-area-inset-top))}

/* ---------- kouzlo ---------- */
#magic{position:absolute;left:50%;bottom:18px;transform:translateX(-50%) scale(.5);opacity:0;
  width:104px;height:104px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd166 55%,#ff9ec4);
  box-shadow:0 0 0 5px rgba(255,255,255,.5),0 0 40px 12px rgba(255,209,102,.6);
  font:inherit;font-size:19px;font-weight:700;color:#7a3f00;transition:transform .3s cubic-bezier(.3,1.5,.5,1),opacity .3s;
  pointer-events:none;bottom:max(18px,env(safe-area-inset-bottom))}
#magic.on{transform:translateX(-50%) scale(1);opacity:1;pointer-events:auto;animation:pulse 1.1s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 5px rgba(255,255,255,.5),0 0 60px 22px rgba(255,209,102,.85)}}

/* ---------- obrazovky ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;padding:24px;text-align:center;background:radial-gradient(80% 60% at 50% 40%,rgba(8,22,58,.62),rgba(8,22,58,.88))}
.screen.show{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
h1{margin:0;font-size:clamp(38px,12vw,68px);font-weight:700;line-height:.95;
  text-shadow:0 4px 0 #0d3a63, 0 0 34px rgba(143,240,226,.7)}
h1 em{display:block;font-style:normal;color:var(--glow)}
h2{margin:0;font-size:clamp(28px,9vw,46px);font-weight:700;text-shadow:0 3px 0 #0d3a63}
p.sub{margin:0;font-size:17px;opacity:.85;max-width:22ch;line-height:1.4}
.btn{border:0;border-radius:999px;padding:20px 46px;font:inherit;font-size:26px;font-weight:700;color:#06304a;
  background:linear-gradient(#bff7ee,#5fd8d0);box-shadow:0 7px 0 #22909a,0 12px 26px rgba(0,0,0,.35);
  transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #22909a}
.btn.pink{color:#5c1030;background:linear-gradient(#ffd3e6,#ff9ec4);box-shadow:0 7px 0 #d1517f,0 12px 26px rgba(0,0,0,.35)}
.btn.pink:active{box-shadow:0 2px 0 #d1517f}
.how{display:flex;flex-direction:column;gap:12px;margin:4px 0 2px}
.how div{display:flex;align-items:center;gap:14px;font-size:20px;font-weight:600}
.how svg{width:52px;height:52px;flex:none}
.stars{display:flex;gap:10px;font-size:46px;filter:drop-shadow(0 3px 0 #0d3a63)}
.stars span{opacity:.2}
.stars span.lit{opacity:1;animation:pop .4s backwards}
.stars span.lit:nth-child(2){animation-delay:.15s}
.stars span.lit:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.heroart{width:min(60vw,230px)}
.heroart svg{width:100%;height:auto;animation:hero 3.4s ease-in-out infinite alternate}
@keyframes hero{from{transform:translateY(-10px) rotate(-3deg)}to{transform:translateY(10px) rotate(3deg)}}

/* boss */
#bossbar{position:absolute;top:74px;left:50%;transform:translateX(-50%);display:none;gap:8px;
  padding-top:max(0px,env(safe-area-inset-top))}
#bossbar.show{display:flex}
#bossbar i{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e3b3ff,var(--magic));
  box-shadow:0 0 0 3px rgba(255,255,255,.35);transition:.25s}
#bossbar i.off{background:rgba(255,255,255,.12);box-shadow:0 0 0 3px rgba(255,255,255,.12);transform:scale(.7)}

@media (prefers-reduced-motion:reduce){
  .amb,.rays,.weed,.swimby,.ent .body{animation:none!important}
}
</style>
</head>
<body>
<div id="stage">
  <div class="rays"></div>
  <div id="bgdeco"></div>
  <div id="city"></div>
  <div id="layer"></div>
  <div id="fx"></div>

  <div id="hud">
    <div id="hearts"></div>
    <div id="bar"><div id="fill"></div></div>
    <button id="sound" aria-label="Zvuk">🔊</button>
  </div>
  <div id="waveTag"></div>
  <div id="bossbar"><i></i><i></i><i></i></div>

  <button id="magic">KOUZLO</button>

  <div class="screen show" id="scrTitle">
    <div class="heroart" id="heroart"></div>
    <h1>Mořské<em>víly</em></h1>
    <div class="how" id="howto"></div>
    <button class="btn" data-go="start">HRÁT</button>
  </div>

  <div class="screen" id="scrWave">
    <h2 id="waveTitle"></h2>
    <p class="sub" id="waveSub"></p>
    <button class="btn" data-go="next">DÁL</button>
  </div>

  <div class="screen" id="scrWin">
    <h2>Vyhrála jsi!</h2>
    <div class="stars" id="stars"><span>★</span><span>★</span><span>★</span></div>
    <p class="sub">Město je v bezpečí.</p>
    <button class="btn pink" data-go="restart">ZNOVU</button>
  </div>

  <div class="screen" id="scrLose">
    <h2>Skoro!</h2>
    <p class="sub">Čaroděj prorazil kopuli. Zkus to ještě jednou.</p>
    <button class="btn pink" data-go="restart">ZNOVU</button>
  </div>
</div>

<script>

const stage=document.getElementById('stage'), layer=document.getElementById('layer'), fx=document.getElementById('fx');
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W=0,H=0,cityTop=0;

/* ================= SPRITY ================= */
const SP={

/* ================= MĚSTO ================= */
$('city').innerHTML=`<svg viewBox="0 0 400 170" preserveAspectRatio="none" style="height:170px">

/* ================= POZADÍ ================= */
(function deco(){
  const d=$('bgdeco');
  let h='';
  if(!reduce){
    for(let i=0;i<16;i++){
      const s=6+Math.random()*18, l=Math.random()*100, t=9+Math.random()*12, dl=Math.random()*12;
      h+=`<span class="amb" style="left:${l}%;width:${s}px;height:${s}px;animation-duration:${t}s;animation-delay:-${dl}s"></span>`;
    }
  }
  for(let i=0;i<7;i++){
    const l=Math.random()*100, sc=.6+Math.random()*.9, d2=Math.random()*3;
    h+=`<div class="weed" style="left:${l}%;transform:scale(${sc});animation-delay:-${d2}s;opacity:.5">
      <svg width="46" height="120" viewBox="0 0 46 120"><path d="M23 120C10 92 6 60 16 26c2-8 10-8 10 0-6 30-2 62 8 94z" fill="#1c7a5e"/>
      <path d="M26 90c8-10 18-12 20-2-8 6-14 8-20 2z" fill="#2aa07a"/></svg></div>`;
  }
  d.innerHTML=h;
  const m1=document.createElement('div'); m1.className='swimby';
  m1.style.cssText='top:22%;animation-duration:34s;animation-delay:-6s;width:80px';
  m1.innerHTML=SP.mermaid('#ff7fb0','#5fd8d0');
  const m2=document.createElement('div'); m2.className='swimby';
  m2.style.cssText='top:56%;animation-duration:46s;animation-delay:-24s;width:64px;transform:scaleX(-1)';
  m2.innerHTML=SP.mermaid('#ffd166','#a05de0');
  d.append(m1,m2);
  $('heroart').innerHTML=SP.mermaid('#ff7fb0','#5fd8d0');
  $('howto').innerHTML=
    `<div>${SP.orb}<span>klepni</span></div>
     <div>${SP.pearl}<span>sbírej</span></div>
     <div>${SP.fish}<span>nech plavat</span></div>`;
})();

/* ================= ZVUK ================= */
let ac=null, muted=false;
function beep(freq,dur,type,vol,slide){
  if(muted) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,ac.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,ac.currentTime+dur);
    g.gain.setValueAtTime(vol||.15,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
  }catch(e){}
}
const SFX={
  pop:()=>beep(620,.16,'triangle',.16,240),
  pearl:()=>{beep(880,.12,'sine',.14);setTimeout(()=>beep(1320,.16,'sine',.12),90)},
  oops:()=>beep(200,.2,'sawtooth',.09,120),
  hit:()=>beep(120,.4,'sawtooth',.2,60),
  magic:()=>{[440,660,880,1180].forEach((f,i)=>setTimeout(()=>beep(f,.3,'sine',.13),i*70))},
  win:()=>{[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.35,'triangle',.15),i*130))},
  boss:()=>beep(90,.6,'sawtooth',.16,50)
};
$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊';if(!muted)SFX.pop();};

/* ================= STAV ================= */
const WAVES=[
  {count:9,  speed:52, gap:1900},
  {count:12, speed:62, gap:1600},
  {count:15, speed:72, gap:1350},
  {boss:true}
];
let ents=[], hearts=3, pearls=0, wave=0, spawned=0, running=false,
    tSpawn=0, tPearl=0, tFriend=0, last=0, frozen=0, boss=null, bossHP=3, orbsLeft=0, tBossAtk=0;
const PEARLS_NEEDED=6;

function resize(){W=stage.clientWidth;H=stage.clientHeight;cityTop=H-Math.min(150,H*0.22);}
addEventListener('resize',resize);resize();

function renderHearts(){
  $('hearts').innerHTML=Array.from({length:3},(_,i)=>
    `<span class="${i<hearts?'':'off'}">${SP.shell}</span>`).join('');
}
function setBar(){
  $('fill').style.width=Math.min(100,pearls/PEARLS_NEEDED*100)+'%';
  $('magic').classList.toggle('on',pearls>=PEARLS_NEEDED&&running);
}

/* ================= EFEKTY ================= */
function burst(x,y,color){
  const d=document.createElement('div'); d.className='pop';
  d.style.left=x+'px'; d.style.top=y+'px';
  let h='';
  for(let i=0;i<9;i++){
    const a=i/9*Math.PI*2, r=34+Math.random()*26;
    h+=`<i style="--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px;background:${color||'#8ff0e2'}"></i>`;
  }
  d.innerHTML=h; fx.appendChild(d); setTimeout(()=>d.remove(),600);
}
function floatText(x,y,txt,color){
  const d=document.createElement('div'); d.className='float';
  d.textContent=txt; d.style.cssText+=`left:${x-30}px;top:${y-20}px;color:${color||'#ffe9a8'}`;
  fx.appendChild(d); setTimeout(()=>d.remove(),1000);
}

/* ================= BYTOSTI ================= */
function spawn(kind,opt){
  opt=opt||{};
  const e={kind,t:Math.random()*6,size:opt.size||64,vy:opt.vy||0,alive:true,
            amp:opt.amp!==undefined?opt.amp:18+Math.random()*22, sw:.6+Math.random()*.7,
            enemy:kind==='orb'||kind==='jelly', friend:kind==='fish'||kind==='turtle'||kind==='star'};
  e.x0=opt.x!==undefined?opt.x:40+Math.random()*Math.max(40,W-120);
  e.x=e.x0; e.y=opt.y!==undefined?opt.y:-80;
  const el=document.createElement('div');
  el.className='ent'; el.style.width=e.size+'px'; el.style.height=e.size+'px';
  el.innerHTML=`<div class="body" style="animation-delay:-${Math.random()*2}s">${
    kind==='bossorb'?SP.orb:SP[kind]}</div>`;
  el.addEventListener('pointerdown',ev=>{ev.preventDefault();tap(e);});
  layer.appendChild(el); e.el=el; ents.push(e);
  return e;
}
function removeEnt(e){e.alive=false;e.el.classList.add('gone');setTimeout(()=>e.el.remove(),320);}

function tap(e){
  if(!running||!e.alive) return;
  const cx=e.x+e.size/2, cy=e.y+e.size/2;
  if(performance.now()<frozen){return;}
  if(e.enemy||e.kind==='bossorb'){
    removeEnt(e); burst(cx,cy,'#c99cf5'); SFX.pop();
    if(e.kind==='bossorb'){orbsLeft--; if(orbsLeft<=0&&boss)boss.open=performance.now()+4500;}
  }else if(e.kind==='pearl'){
    removeEnt(e); burst(cx,cy,'#ffe9a8'); SFX.pearl();
    pearls=Math.min(PEARLS_NEEDED,pearls+1); setBar();
  }else if(e.friend){
    e.vy=Math.max(e.vy,150); e.amp=0; e.x0=e.x;
    burst(cx,cy,'#bff7ee'); floatText(cx,cy,'jejda!','#bff7ee'); SFX.oops();
    frozen=performance.now()+550;
  }else if(e.kind==='boss'){
    if(boss&&boss.open>performance.now()){
      boss.open=0; bossHP--; SFX.hit(); burst(cx,cy,'#ffd166');
      stage.classList.add('shake'); setTimeout(()=>stage.classList.remove('shake'),400);
      [...$('bossbar').children].forEach((n,i)=>n.classList.toggle('off',i>=bossHP));
      if(bossHP<=0){removeEnt(e);boss=null;setTimeout(win,700);}
      else spawnBossOrbs();
    }else{ burst(cx,cy,'#7ad9ff'); SFX.oops(); }
  }
}

function hitCity(e){
  removeEnt(e); hearts--; renderHearts(); SFX.hit();
  burst(e.x+e.size/2, cityTop+10, '#ff8fb0');
  stage.classList.add('shake'); $('city').classList.add('hurt');
  setTimeout(()=>{stage.classList.remove('shake');$('city').classList.remove('hurt');},520);
  if(hearts<=0) lose();
}

function castMagic(){
  if(pearls<PEARLS_NEEDED||!running) return;
  pearls=0; setBar(); SFX.magic();
  const r=document.createElement('div'); r.className='ring'; fx.appendChild(r);
  setTimeout(()=>r.remove(),850);
  ents.filter(e=>e.alive&&(e.enemy||e.kind==='bossorb')).forEach((e,i)=>{
    setTimeout(()=>{if(e.alive){burst(e.x+e.size/2,e.y+e.size/2,'#ffe9a8');removeEnt(e);
      if(e.kind==='bossorb'){orbsLeft--;if(orbsLeft<=0&&boss)boss.open=performance.now()+4500;}}},i*70);
  });
}
$('magic').onclick=castMagic;

/* ================= SMYČKA ================= */
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-(last||now))/1000); last=now;
  if(!running) return;
  const cfg=WAVES[wave];

  if(!cfg.boss){
    tSpawn-=dt*1000;
    if(tSpawn<=0&&spawned<cfg.count){
      tSpawn=cfg.gap;
      spawn(Math.random()<.6?'orb':'jelly',{vy:cfg.speed*(.85+Math.random()*.4),size:Math.random()<.5?64:72});
      spawned++;
    }
    if(spawned>=cfg.count&&!ents.some(e=>e.alive&&e.enemy)) return nextWave();
  }else if(boss){
    boss.t+=dt;
    boss.x=W/2-60+Math.sin(boss.t*.55)*Math.min(W*0.3,150);
    boss.y=48+Math.sin(boss.t*1.1)*10;
    boss.el.style.transform=`translate(${boss.x}px,${boss.y}px)`;
    boss.el.style.filter=boss.open>now?'drop-shadow(0 0 22px #ffd166) brightness(1.15)':'none';
    let a=0;
    ents.filter(e=>e.alive&&e.kind==='bossorb').forEach((e,i,arr)=>{
      a=boss.t*1.6+i/arr.length*Math.PI*2;
      e.x=boss.x+52+Math.cos(a)*88-e.size/2;
      e.y=boss.y+62+Math.sin(a)*46-e.size/2;
      e.el.style.transform=`translate(${e.x}px,${e.y}px)`;
    });
    tBossAtk-=dt*1000;
    if(tBossAtk<=0){
      tBossAtk=1900;
      spawn(Math.random()<.5?'orb':'jelly',{x:boss.x+40,y:boss.y+90,vy:80,size:60});
    }
  }

  tPearl-=dt*1000;
  if(tPearl<=0){tPearl=3800+Math.random()*2200;spawn('pearl',{vy:70,size:60});}
  tFriend-=dt*1000;
  if(tFriend<=0){
    tFriend=4200+Math.random()*2600;
    const k=['fish','turtle','star'][Math.floor(Math.random()*3)];
    spawn(k,{vy:60+Math.random()*30,size:k==='star'?60:70});
  }

  for(const e of ents){
    if(!e.alive||e.kind==='boss'||e.kind==='bossorb') continue;
    e.t+=dt; e.y+=e.vy*dt;
    e.x=e.x0+Math.sin(e.t*e.sw)*e.amp;
    e.el.style.transform=`translate(${e.x}px,${e.y}px)`;
    if(e.enemy&&e.y+e.size>=cityTop) hitCity(e);
    else if(e.y>H+100) removeEnt(e);
  }
  ents=ents.filter(e=>e.alive);
}
requestAnimationFrame(loop);

/* ================= PRŮBĚH ================= */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));if(id)$(id).classList.add('show');}
function clearAll(){ents.forEach(e=>e.el.remove());ents=[];boss=null;layer.innerHTML='';}

function startWave(){
  show(null); clearAll(); spawned=0; tSpawn=600; tPearl=2600; tFriend=3400;
  $('waveTag').textContent=WAVES[wave].boss?'':`vlna ${wave+1} ze 3`;
  $('bossbar').classList.toggle('show',!!WAVES[wave].boss);
  if(WAVES[wave].boss) startBoss();
  running=true; last=0; setBar();
}
function startBoss(){
  bossHP=3; tBossAtk=2200;
  [...$('bossbar').children].forEach(n=>n.classList.remove('off'));
  boss=spawn('boss',{x:W/2-60,y:48,size:120,amp:0}); boss.t=0; boss.open=0; boss.enemy=false;
  boss.el.style.width='120px'; boss.el.style.height='130px';
  spawnBossOrbs(); SFX.boss();
}
function spawnBossOrbs(){
  orbsLeft=3;
  for(let i=0;i<3;i++){const o=spawn('bossorb',{x:-200,y:-200,size:56,amp:0});o.enemy=false;}
}
function nextWave(){
  running=false; wave++;
  if(hearts<3){hearts++;renderHearts();}
  if(WAVES[wave].boss){
    $('waveTitle').textContent='Čaroděj!';
    $('waveSub').textContent='Nejdřív rozbij tři koule. Pak klepni na čaroděje.';
  }else{
    $('waveTitle').textContent='Skvěle!';
    $('waveSub').textContent='Město drží. Přichází další vlna.';
  }
  show('scrWave');
}
function win(){
  running=false; clearAll(); show('scrWin'); SFX.win();
  [...$('stars').children].forEach((s,i)=>s.classList.toggle('lit',i<hearts));
  $('waveTag').textContent=''; $('bossbar').classList.remove('show'); $('magic').classList.remove('on');
}
function lose(){
  running=false; clearAll(); show('scrLose');
  $('waveTag').textContent=''; $('bossbar').classList.remove('show'); $('magic').classList.remove('on');
}
function reset(){hearts=3;pearls=0;wave=0;renderHearts();setBar();startWave();}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-go]'); if(!b) return;
  const go=b.dataset.go;
  if(go==='start'||go==='restart') reset();
  if(go==='next') startWave();
});

renderHearts(); setBar();
})();
</script>
</body>
</html>
